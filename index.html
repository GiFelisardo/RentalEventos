<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet');
    </style>
</head>
<body>
    <header>
        <h1>Rental Eventos </h1>
        <h2>Locação de equipamentos</h2>
    </header>

    <main>

        <div class="login-card">

        <div class="login-titulo">
                <h3>Login</h3>
                <p>Acesse sua conta para continuar</p>
        </div>

        <form id="loginForm">

        <div>

            <div class="nome">
            <input type="text" id="nome" placeholder="Nome">
            </div>

            <div class="setor">
            <label for="setor"></label>
            <select name="setor" id="setor">
                <option value="" disabled selected>Setor</option>
                <option value="gerente">Gerente</option>
                <option value="atendente">Atendente</option>
                <option value="estoquista">Estoquista</option>
                <option value="contabilidade">Contabilidade</option>
                <option value="outro">Outro</option>
            </select>
            </div>

            <div class="senha">
            <input type="password" name="senha" id="senha" placeholder="Senha">
            </div>
            
            <p id="mensagemErro"></p>

            <div class="button">
                <button type="submit">Entrar</button>
            </div>

        </div>
        </form>

        <a href="#" class="esqueci-senha">Esqueci a senha</a>
        </div>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
