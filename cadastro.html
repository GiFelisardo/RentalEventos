<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

    <main class="equipamentos">
        <div class="cadastro-equipamentos">
            <H1>Equipamentos</H1>
            <input type="text" placeholder="Marca">
            <input type="text" placeholder="Modelo">
            <label for="categoria"></label>
            <select name="categoria" id="categoria">
                <option value="">Todas</option>
                <option value="Cadeiras">Cadeiras</option>
                <option value="Mesas">Mesas</option>
                <option value="Áudio">Áudio</option>
                <option value="Projetor">Projetor</option>
                <option value="Microfone">Microfone</option>
                <option value="Tendas">Tendas</option>
                <option value="Painel LED">Painel LED</option>
                <option value="Outros">Outros</option>
            </select>
            <input type="text" placeholder="Potência">
            <input type="text" placeholder="Material">
            <input type="number" placeholder="Peso">
            <input type="number" placeholder="Dimensões">
            <input type="text" placeholder="Cor">
            <input type="number" placeholder="Quantidade disponível">
            <input type="number" placeholder="Quantidade mínima">

            <button>Cadastrar</button>
        </div>

        <div class="acoes">

    <!-- FILTROS -->
     <section class="consulta">

        <h1>Equipamentos</h1>

        <!-- PESQUISA -->
        <div class="acoes">

            <div class="barra-pesquisa">
                <input 
                    type="search"
                    id="pesquisa"
                    placeholder="Pesquisar equipamento..."
                >

                <button type="button">
                    Pesquisar
                </button>
            </div>

            <button 
                type="button"
                id="btnFiltros"
                class="btn-filtros">
                Filtros
            </button>

        </div>


        <!-- FILTROS -->
        <div id="filtros" class="filtros">

            <div class="filtro">
                <label>Marca</label>
                <input type="text" id="marcaFiltro">
            </div>

            <div class="filtro">
                <label>Modelo</label>
                <input type="text" id="modeloFiltro">
            </div>

            <div class="filtro">
                <label>Categoria</label>
                <select id="categoriaFiltro">
                    <option value="">Todas</option>
                    <option>Cadeiras</option>
                    <option>Mesas</option>
                    <option>Caixas de som</option>
                    <option>Projetores</option>
                    <option>Microfones</option>
                    <option>Tendas</option>
                    <option>Painéis de LED</option>
                </select>
            </div>

            <div class="filtro">
                <label>Potência</label>
                <input type="text">
            </div>

            <div class="filtro">
                <label>Material</label>
                <input type="text">
            </div>

            <div class="filtro">
                <label>Peso</label>
                <input type="text">
            </div>

            <div class="filtro">
                <label>Dimensões</label>
                <input type="text">
            </div>

            <div class="filtro">
                <label>Cor</label>
                <input type="text">
            </div>

            <div class="filtro">
                <label>Quantidade disponível</label>
                <input type="number">

            <button type="button" id="limparFiltros">
                Limpar filtros
            </button>
            </div>

        </div>


        <!-- LISTAGEM -->
        <div class="lista-equipamentos">

            <h2>Equipamentos cadastrados</h2>

            <div id="listaEquipamentos">
                <!-- Os equipamentos serão inseridos aqui pelo JavaScript -->
            </div>

        </div>

    </section>
    </div>

        <div class="alertas">
            <h2>⚠ ALERTAS</h2>
            <div id="listaAlertas">
                <!-- Alertas serão inseridos automaticamente -->
            </div>

        </div>


</main>
    </main>
</body>
</html>
